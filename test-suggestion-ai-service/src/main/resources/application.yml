  # SpringAI - 通义千问配置
  ai:
    dashscope:
      api-key:
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
          max-tokens: 2000

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.assist.common.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 日志配置
logging:
  level:
    com.neusoft.neu23: debug
    com.assist.common: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

