server:
  port: 8084

spring:
  application:
    name: test-suggestion-ai-service
  
  # Nacos 配置导入
  config:
    import: optional:nacos:test-suggestion-ai-service.yaml
  
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://82.157.188.65:2000/pool2?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: mysql_awJcEH
  
  # Nacos服务发现和配置中心
  cloud:
    nacos:
      discovery:
        enabled: true  # 启用服务发现
        server-addr: localhost:8848  # Nacos 核心 API 端口（Java 客户端连接）
        namespace: public  # 使用 public 命名空间（如果 dev 不存在）
        group: DEFAULT_GROUP
        # 鉴权已关闭，不需要配置用户名密码
        # 注册配置
        register-enabled: true  # 确保启用注册
        ip:  # 留空，自动获取
        port: 8084  # 服务端口
      config:
        enabled: true  # 启用配置中心
        server-addr: localhost:8848  # Nacos 核心 API 端口
        file-extension: yaml
        namespace: dev
        group: DEFAULT_GROUP
        # 鉴权已关闭，不需要配置用户名密码
  
  # SpringAI - 通义千问配置
  ai:
    dashscope:
      api-key:
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
          max-tokens: 2000

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.assist.common.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 日志配置
logging:
  level:
    com.neusoft.neu23: debug
    com.assist.common: debug
    com.alibaba.cloud.nacos: debug  # Nacos 相关日志
    com.alibaba.nacos: debug  # Nacos 客户端日志
    org.springframework.cloud: debug  # Spring Cloud 日志
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

