server:
  port: 8202

spring:
  application:
    name: diagnosis-ai-service

  config:
    import: "optional:nacos:application-${spring.profiles.active:default}.yml"

  # Nacos配置
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        enabled: false
        server-addr: localhost:8848
        namespace: public
        file-extension: yml

  # SpringAI - 通义千问配置（使用OpenAI兼容模式）
  ai:
    openai:
      api-key: sk-45be1e34b677429db3a614c91fc07f2b
      base-url: https://dashscope.aliyuncs.com/compatible-mode/
      chat:
        options:
          model: qwen-flash
          temperature: 0.8
          max-tokens: 2000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 如果 Redis 设置了密码，请在这里填写
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://82.157.188.65:2000/pool2?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: mysql_awJcEH
    type: com.alibaba.druid.pool.DruidDataSource

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.assist.common.entity
  global-config:
    db-config:
      id-type: auto  # 全局使用数据库自增 ID

logging:
  level:
    com.assist.diagnosis: debug
    org.springframework.ai: debug
