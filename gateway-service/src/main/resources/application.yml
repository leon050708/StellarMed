server:
  port: 8888  # 网关对外统一端口（8080 被 Nacos 占用，改为 8888）

spring:
  application:
    name: gateway-service

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 如果 Redis 设置了密码，请在这里填写
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848 # Nacos 地址

    gateway:
      discovery:
        locator:
          enabled: true # 开启从 Nacos 自动发现服务，这样 lb://service-name 才能生效
          lower-case-service-id: true

      # --- 全局跨域配置 (解决前端 CORS 问题) ---
      # 修复点：Spring Boot 2.4+ 必须使用 allowedOriginPatterns 代替 allowedOrigins
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"   # <--- 这里是关键修改！
            allowedMethods: "*"          # 允许所有 HTTP 方法 (GET, POST, PUT, DELETE等)
            allowedHeaders: "*"          # 允许所有 Header
            allowCredentials: true       # 允许携带 Cookie
            maxAge: 3600

      # --- 路由规则配置 ---
      routes:
        # 1. 患者服务 (Patient Service) - 核心入口
        # 将多个路径拆分为多个路由规则，避免 Path 谓词语法问题
        - id: patient-service-patients
          uri: lb://patient-service
          predicates:
            - Path=/api/patients/**
        - id: patient-service-sessions
          uri: lb://patient-service
          predicates:
            - Path=/api/sessions/**
        - id: patient-service-chat
          uri: lb://patient-service
          predicates:
            - Path=/api/chat/**
        - id: patient-service-symptoms
          uri: lb://patient-service
          predicates:
            - Path=/api/symptoms/**
        - id: patient-service-assist
          uri: lb://patient-service
          predicates:
            - Path=/api/assist/**

        # 2. 医生确认服务 (Doctor Confirm Service) - 医生端入口
        - id: doctor-confirm-service
          uri: lb://doctor-confirm-service
          predicates:
            - Path=/api/doctor-confirm/**
        # 2.1 医生登录和患者查询
        - id: doctor-service
          uri: lb://doctor-confirm-service
          predicates:
            - Path=/api/doctor/**

        # --- 以下为 AI 服务路由 ---

        # 3. 症状 AI
        - id: symptom-ai-service
          uri: lb://symptom-ai-service
          predicates:
            - Path=/api/ai/symptoms/**

        # 4. 检查建议 AI
        - id: test-suggestion-ai-service
          uri: lb://test-suggestion-ai-service
          predicates:
            - Path=/api/ai/test-suggestions/**

        # 5. 诊断 AI
        - id: diagnosis-ai-service-diagnosis
          uri: lb://diagnosis-ai-service
          predicates:
            - Path=/api/ai/diagnosis/**
        - id: diagnosis-ai-service-risk
          uri: lb://diagnosis-ai-service
          predicates:
            - Path=/api/ai/risk/**

        # 6. 总结 AI
        - id: summary-ai-service
          uri: lb://summary-ai-service
          predicates:
            - Path=/api/ai/session-summary/**

        # 7. 处方 AI
        - id: prescription-ai-service
          uri: lb://prescription-ai-service
          predicates:
            - Path=/api/ai/prescriptions/**
